<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1>ChurnPredict AI</h1>
            <p>Real-time customer risk assessment</p>
        </header>

        <form id="churn-form">
            <div class="input-group">
                <label for="tenure">Tenure (Months) <span id="tenure-val">12</span></label>
                <input type="range" id="tenure" name="tenure" min="0" max="72" value="12" oninput="document.getElementById('tenure-val').innerText = this.value">
            </div>

            <div class="input-group">
                <label for="monthly-charges">Monthly Charges ($) <span id="charges-val">85.50</span></label>
                <input type="range" id="monthly-charges" name="monthly_charges" min="0" max="150" step="0.5" value="85.5" oninput="document.getElementById('charges-val').innerText = this.value">
            </div>

            <div class="input-group drop-group">
                <label for="contract">Contract Type</label>
                <select id="contract" name="contract">
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One year</option>
                    <option value="Two year">Two year</option>
                </select>
            </div>

            <button type="submit" id="predict-btn">Analyze Risk</button>
        </form>

        <div id="result-overlay" class="hidden">
            <div class="result-card">
                <h2 id="prediction-title">Risk Assessment</h2>
                <div class="progress-ring">
                    <svg viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" class="ring-bg"></circle>
                        <circle cx="50" cy="50" r="40" class="ring-progress" id="prob-ring"></circle>
                    </svg>
                    <div class="prob-text" id="prob-text">0%</div>
                </div>
                <p id="risk-status">Low Risk</p>
                <button id="close-btn" class="secondary-btn">New Analysis</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
